                  - id
                properties:
                  id:
                    allOf:
                      - description: The unique identifier of a learner.
                        type: string
                        pattern: ^[a-zA-Z0-9]+$
                        example: abc123def4
        '400':
          description: Bad Request
          content: *ref_6
        '401':
          description: Unauthorized
          content: *ref_7
