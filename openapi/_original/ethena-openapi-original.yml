                          - "fr": French
                          - "de": German
                          
                        ❌ Common invalid examples, which will cause validation errors:
                          - "English" (use "en" instead)
                          - "Spanish" (use "es" instead)  
                          - "Chinese" (use "zh" instead)
                      type: string
                      minLength: 2
                      maxLength: 32
                      example: en
