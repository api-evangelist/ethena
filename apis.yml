aid: ethena
name: Ethena
description: >-
  Ethena is a compliance platform powered by AI agents that helps organizations
  manage employee compliance training, disclosure reviews, policy management,
  third-party risk screening, and ethics/whistleblower reporting for more than
  2,000 organizations. Its product surface includes a Training Agent, Disclosure
  Agent, Policy Agent, and Third-Party Risk Agent, an ethics hotline with case
  management, a phishing simulator, and a library of 200+ compliance courses
  (AML, harassment prevention, HIPAA, cybersecurity, and more). Ethena publishes
  a REST API (OpenAPI 3.1, https://api.goethena.com) for viewing and managing
  learners and training information and for subscribing to training-completion
  webhooks, alongside SSO, SCIM/HRIS provisioning, and SCORM/LMS export. The
  platform is SOC 2 Type II certified.
